*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── primitives: three colours. THE ACCENT is the one line a new plugin changes. ── */
  --color-bg:     #000000;   /* black ground */
  --color-bone:   #ded3bc;   /* the light ink: type, hairlines, fills */
  --color-accent: #f08a24;   /* ONE per plugin — pick from plugin.md §3 */

  /* ── the bone ladder, pre-composited on black (bone @ 1 / .65 / .40 / .16).
       Solid colours, not alpha: the contrast declared is the contrast rendered.
       Do not invent steps. Never put `opacity` on text or a text ancestor. ── */
  --ink-text: #ded3bc;   /* 1.00  values, primary labels         14.2:1 */
  --ink-dim:  #90897a;   /* 0.65  captions, secondary labels      6.1:1 */
  --ink-rule: #59544b;   /* 0.40  hairlines, borders, empty ticks — NEVER text (2.8:1) */
  --ink-hair: #23221e;   /* 0.16  wells, tracks, hover wash — NEVER text */

  /* ── roles ── */
  --ink-live:      var(--color-accent);   /* "on / selected / now" — a GROUND or a MARK, never text */
  --ink-on-accent: #000000;               /* text and glyphs sitting on the accent */
  --ink-on-bone:   #000000;               /* text and glyphs sitting on a bone fill */
  /* An alias resolves where it is declared: if the accent is overridden on a
     descendant, re-declare --ink-live there too. */

  /* ── type ── */
  --font-display: 'Silkscreen', 'Space Mono', ui-monospace, monospace;
  --font-body:    'Space Mono', ui-monospace, monospace;

  --text-nano:  8px;    /* version, hints */
  --text-micro: 9px;    /* labels, buttons, tabs — the workhorse */
  --text-xs:    10px;   /* values, panel base size, brand chip */
  --text-sm:    11px;   /* emphasised values, modal title */
  --text-base:  13px;   /* knob centre values */
  --text-lg:    18px;   /* a hero read-out */
  --text-xl:    26px;   /* one big number per screen, at most */
  --text-2xl:   38px;   /* splash / signature overprint only */

  --track-body: 0.04em; /* the panel's default */
  --track-caps: 0.16em; /* UPPERCASE captions, buttons, tabs */
  --track-wide: 0.22em; /* rare: a sparse section heading */

  /* ── spacing: tight on purpose — the window is small ── */
  --space-0: 2px;
  --space-1: 4px;
  --space-2: 6px;
  --space-3: 9px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 22px;

  /* ── shape: no rounded corners, no shadows, 1px lines ── */
  --radius: 0px;
  --hair: 1px;

  /* ── the window: designed at this size, scaled as one piece (PluginCanvas) ── */
  --panel-w: 620px;
  --panel-h: 410px;
  --row-mast:   22px;   /* masthead */
  --row-tabs:   18px;   /* tab bar, when tabs are not in the masthead */
  --row-status: 22px;   /* status strip */
  --ctl-sm: 15px;       /* masthead / status buttons, selects */
  --ctl-md: 18px;       /* body buttons, segments, tabs */
  --ctl-lg: 22px;       /* text fields, modal buttons */
  --icon:   10px;       /* one pixel-icon cell = 1px; 20px = the 2x size */

  /* ── motion ── */
  --dur-ui:   120ms;    /* the only UI transition length (opacity/colour fades) */
  --boil-ms:  140ms;    /* signature-piece displacement frame */
  --meter-hz: 30;       /* meters/visualisers poll rate */

  /* ── grain: share of ground pixels lifted to --grain-ink (solid, no alpha) ── */
  --grain-density: 0.055;
  --grain-ink: #141311;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--color-bg);   /* same as the native editor: nothing flashes on open */
}

/* base.css — GSDF Style Guide by Daftsins · plugin half.
   Copy to the top of ui/src/App.css (or import it right after index.css).
   Resets, the stage + 620x410 canvas, shared type, the plain button.
   Binds only to tokens.css roles. No hex below this line. */

html, body, #root {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--color-bg);
  color: var(--ink-text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

button {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  background: none;
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
}
:focus-visible { outline: var(--hair) solid var(--ink-dim); outline-offset: 1px; }

/* ── stage + canvas: PluginCanvas.tsx scales .app-canvas as one piece ── */
.app-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--color-bg);
}
.app-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--panel-w);
  height: var(--panel-h);
  transform-origin: 0 0;
  overflow: hidden;
  background: var(--color-bg);
  color: var(--ink-text);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--track-body);
  line-height: 1;
  display: grid;
  /* masthead · (tabs) · body · status — set per plugin, keep the fixed rows */
  grid-template-rows: var(--row-mast) minmax(0, 1fr) var(--row-status);
  grid-template-columns: minmax(0, 1fr);
}
.app-canvas--tabs { grid-template-rows: var(--row-mast) var(--row-tabs) minmax(0, 1fr) var(--row-status); }
.app-canvas canvas { display: block; image-rendering: pixelated; }

.grain {
  position: absolute;
  inset: 0;
  width: var(--panel-w);
  height: var(--panel-h);
  z-index: 0;
  pointer-events: none;
  image-rendering: pixelated;
}
.app-canvas > :not(.grain) { position: relative; z-index: 1; }
.app-canvas > .mh { z-index: 3; }   /* masthead menus drop over everything */

/* ── shared type ── */
.lbl  { color: var(--ink-dim);  font-size: var(--text-micro); letter-spacing: var(--track-caps); white-space: nowrap; }
.val  { color: var(--ink-text); font-size: var(--text-xs); text-align: right; white-space: pre; font-variant-numeric: tabular-nums; }
.num  { font-family: var(--font-display); color: var(--ink-text); font-size: var(--text-xs); letter-spacing: 0.06em; }
.hint { color: var(--ink-dim);  font-size: var(--text-nano); letter-spacing: var(--track-caps); }
.sec-hd { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
.hr { height: var(--hair); background: var(--ink-rule); margin: var(--space-0) 0; flex: none; }

/* ── a region: a column of the body. Columns are split by a single hairline. ── */
.zone { min-width: 0; min-height: 0; padding: var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); }
.zone + .zone { border-left: var(--hair) solid var(--ink-rule); }

/* ── the plain button: hairline box, bone text; ON = accent ground, black text ── */
.btn {
  height: var(--ctl-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  padding: 0 var(--space-2);
  border: var(--hair) solid var(--ink-rule);
  color: var(--ink-text);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  white-space: nowrap;
}
.btn--sm { height: var(--ctl-sm); }
.btn:hover { border-color: var(--ink-text); }
.btn[aria-pressed="true"], .btn.on { background: var(--ink-live); border-color: var(--ink-live); color: var(--ink-on-accent); }
.btn:disabled { color: var(--ink-dim); border-color: var(--ink-hair); cursor: default; }

/* ── a native select, flattened ── */
.select {
  height: var(--ctl-sm);
  padding: 0 var(--space-1);
  border: var(--hair) solid var(--ink-rule);
  border-radius: var(--radius);
  background: var(--color-bg);
  color: var(--ink-text);
  font-family: var(--font-body);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
}
.select:hover, .select:focus { border-color: var(--ink-text); outline: none; }
.select option { background: var(--color-bg); color: var(--ink-text); }

/* IconButton.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.px-icon { display: block; flex: none; }

.ib {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  border: var(--hair) solid var(--ink-rule);
  color: var(--ink-text);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  white-space: nowrap;
}
.ib--sm { height: var(--ctl-sm); min-width: var(--ctl-sm); }
.ib--md { height: var(--ctl-md); min-width: var(--ctl-md); }
.ib--label { padding: 0 var(--space-2) 0 var(--space-1); }
.ib:hover { border-color: var(--ink-text); }
.ib[aria-pressed="true"] { background: var(--ink-live); border-color: var(--ink-live); color: var(--ink-on-accent); }
.ib:disabled { color: var(--ink-rule); border-color: var(--ink-hair); cursor: default; }

.ib--bare { border-color: transparent; color: var(--ink-dim); }
.ib--bare:hover { border-color: transparent; color: var(--ink-text); }
.ib--bare[aria-pressed="true"] { background: none; border-color: transparent; color: var(--ink-text); }

/* Knob.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.knob {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
  min-width: 0;
}
.knob-dial {
  position: relative;
  flex: none;
  cursor: ns-resize;
  touch-action: none;
}
.knob-dial svg { display: block; }
.knob-dial rect.off { fill: var(--ink-hair); }
.knob-dial rect.on  { fill: var(--ink-text); }
.knob-dial:hover rect.off { fill: var(--ink-rule); }
.knob.is-dragging rect.on { fill: var(--ink-live); }

.knob-val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: var(--text-xs);
  color: var(--ink-text);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}
.knob--26 .knob-val { font-size: var(--text-nano); }
.knob--44 .knob-val { font-size: var(--text-sm); }

.knob-lbl {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  color: var(--ink-dim);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  white-space: nowrap;
}
.knob:hover .knob-lbl, .knob.is-dragging .knob-lbl { color: var(--ink-text); }

/* BarSlider.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.bar-row { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.bar-lbl { width: 44px; flex: none; display: inline-flex; align-items: center; gap: var(--space-1); }
.bar-val { width: 52px; flex: none; }

.bar {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 9px;
  background: var(--ink-hair);
  cursor: ew-resize;
  touch-action: none;
}
.bar:hover { background: var(--ink-rule); }
.bar-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink-text); pointer-events: none; }
.bar-zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink-dim); pointer-events: none; }
.bar-row.is-dragging .bar-fill { background: var(--ink-live); }
.bar-row.is-dragging .bar-lbl { color: var(--ink-text); }

/* Segment.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.seg {
  display: grid;
  gap: 1px;
  background: var(--ink-rule);
  border: var(--hair) solid var(--ink-rule);
  min-width: 0;
}
.seg button {
  height: var(--ctl-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  padding: 0 var(--space-1);
  background: var(--color-bg);
  color: var(--ink-dim);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  white-space: nowrap;
  min-width: 0;
}
.seg button:hover { color: var(--ink-text); }
.seg button[aria-checked="true"] { background: var(--ink-text); color: var(--ink-on-bone); }

/* Toggle = .btn (base.css) + aria-pressed; nothing extra but a fixed min width */
.tgl { min-width: 40px; }

/* TabBar.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.tabs { display: flex; align-items: stretch; min-width: 0; white-space: nowrap; }
.tabs button {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-3) 0 var(--space-2);
  color: var(--ink-dim);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
}
.tabs button:hover { color: var(--ink-text); }
.tabs button[aria-selected="true"] { background: var(--ink-live); color: var(--ink-on-accent); }

/* row: its own 18px band, separated from the body by a hairline, tabs split by hairlines */
.tabs--row {
  height: var(--row-tabs);
  border-bottom: var(--hair) solid var(--ink-rule);
  padding-right: var(--space-3);
  align-items: stretch;
}
.tabs--row button { border-right: var(--hair) solid var(--ink-hair); }
.tabs--row .tabs-gap { flex: 1; }
.tabs--row > :last-child:not(button) { align-self: center; }

/* mast: compact hairline buttons inside the 22px masthead */
.tabs--mast { gap: var(--space-1); align-items: center; }
.tabs--mast button { height: var(--ctl-sm); padding: 0 var(--space-2) 0 var(--space-1); border: var(--hair) solid var(--ink-rule); color: var(--ink-text); }
.tabs--mast button:hover { border-color: var(--ink-text); }
.tabs--mast button[aria-selected="true"] { border-color: var(--ink-live); }

/* Masthead.css — GSDF Style Guide by Daftsins. Roles only, no hex.
   Accent appears here as a GROUND (the chip, a pressed button), never as text. */
.mh {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-2) 0 0;
  border-bottom: var(--hair) solid var(--ink-rule);
  white-space: nowrap;
  min-width: 0;
}
.mh-logo {
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-3);
  margin-right: var(--space-1);
  background: var(--ink-live);
  color: var(--ink-on-accent);
  font-family: var(--font-display);
  font-size: var(--text-xs);
  letter-spacing: var(--track-body);
}
.mh-preset {
  height: var(--ctl-sm);
  max-width: 140px;
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: 0 var(--space-1);
  border: var(--hair) solid var(--ink-rule);
  color: var(--ink-text);
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
}
.mh-preset:hover { border-color: var(--ink-text); }
.mh-preset[aria-pressed="true"] { background: var(--ink-live); border-color: var(--ink-live); color: var(--ink-on-accent); }
.mh-preset-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

.mh-spacer { flex: 1; }
.mh-version { font-size: var(--text-nano); letter-spacing: var(--track-caps); color: var(--ink-dim); text-transform: none; }

.mh-menu-wrap { position: relative; display: flex; align-items: center; }
.mh-menu { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--ink-text); }
.mh-menu-list {
  position: absolute;
  top: 18px;
  right: 0;
  width: 150px;
  background: var(--color-bg);
  border: var(--hair) solid var(--ink-text);
  z-index: 30;
  display: flex;
  flex-direction: column;
}
.mh-menu-item {
  height: var(--ctl-lg);
  padding: 0 var(--space-3);
  text-align: left;
  font-size: var(--text-micro);
  letter-spacing: var(--track-caps);
  color: var(--ink-text);
  background: var(--color-bg);
}
.mh-menu-item + .mh-menu-item { border-top: var(--hair) solid var(--ink-hair); }
.mh-menu-item:hover { background: var(--ink-hair); }
.mh-menu-item--destructive { border-top-color: var(--ink-rule) !important; }

/* Meter.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.meter { display: block; flex: none; image-rendering: pixelated; cursor: pointer; }

.ro { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; height: 14px; }
.ro-lbl { display: inline-flex; align-items: center; gap: var(--space-1); }

.ro-big { display: flex; align-items: baseline; gap: var(--space-1); }
.ro-big-num { font-family: var(--font-display); font-size: var(--text-xl); color: var(--ink-text); letter-spacing: 0.02em; line-height: 1; }

/* Modal.css — GSDF Style Guide by Daftsins. Roles only, no hex.
   Render the Modal INSIDE .app-canvas so it scales with the panel. */
.modal-backdrop {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-dialog {
  width: 280px;
  padding: var(--space-5);
  border: var(--hair) solid var(--ink-text);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.modal-message { font-family: var(--font-display); font-size: var(--text-sm); color: var(--ink-text); letter-spacing: 0.06em; }
.modal-sub { font-size: var(--text-micro); color: var(--ink-dim); text-transform: none; letter-spacing: var(--track-body); line-height: 1.4; }
.modal-actions { display: flex; gap: var(--space-1); }
.modal-actions .btn { flex: 1; height: var(--ctl-lg); }

/* StatusStrip.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-3);
  border-top: var(--hair) solid var(--ink-rule);
  white-space: nowrap;
  min-width: 0;
}
.status .lbl { display: inline-flex; align-items: center; gap: var(--space-1); }
.status .val { width: 48px; }
.st-gap { flex: 1; min-width: 0; }
.st-msg { font-size: var(--text-nano); color: var(--ink-dim); letter-spacing: var(--track-caps); }

/* SignaturePiece.css — GSDF Style Guide by Daftsins. Roles only, no hex. */
.sig {
  position: relative;
  flex: 1;
  min-height: 0;
  border: var(--hair) solid var(--ink-rule);
  background: var(--color-bg);
  overflow: hidden;
}
.sig-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

/* mockup layout — the only plugin-specific CSS; tokens only */
.body3 { display: grid; grid-template-columns: 186px minmax(0, 1fr) 176px; min-height: 0; }
.zone--knobs { justify-content: space-between; }
.knob-grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: var(--space-3); justify-items: center; padding-top: var(--space-1); }
.tgl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1); }
.tabs-info { display: inline-flex; align-items: center; gap: var(--space-1); }
.sig--square { flex: none; aspect-ratio: 1 / 1; }
.zone--knobs .knob-grid { flex: 1; align-content: center; }
.zone-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-1); }
.knob-row { display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; padding: var(--space-1) 0; }
.ib-row { display: flex; gap: var(--space-1); }
.ib-row .ib { flex: 1; }
.heads { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-1); }
.heads .btn { min-width: 0; }

</style></head>
